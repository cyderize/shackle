name: Set up MiniZinc Edge
description: Download MiniZinc Edge and expose its executable and standard library

runs:
  using: composite
  steps:
    - name: Identify MiniZinc Edge release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset_pattern='MiniZinc-build*-x86_64-linux-gnu.tar.gz' ;;
          Linux/ARM64) asset_pattern='MiniZinc-build*-aarch64-linux-gnu.tar.gz' ;;
          macOS/ARM64) asset_pattern='MiniZinc-build*-aarch64-apple-darwin.tar.gz' ;;
          Windows/X64) asset_pattern='MiniZinc-build*-x86_64-windows.zip' ;;
          *)
            echo "MiniZinc Edge setup is not implemented for $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac

        release_json="$(gh api repos/MiniZinc/libminizinc/releases/tags/edge)"
        asset_name="$(jq -r --arg pattern "$asset_pattern" \
          '[.assets[] | select(.name | test($pattern | gsub("\\*"; ".*")))] | first | .name // empty' \
          <<<"$release_json")"
        asset_id="$(jq -r --arg name "$asset_name" \
          '.assets[] | select(.name == $name) | .id' <<<"$release_json")"
        test -n "$asset_name"
        test -n "$asset_id"
        echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
        echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"

    - name: Cache MiniZinc Edge archive
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/minizinc/downloads
        key: minizinc-edge-${{ runner.os }}-${{ runner.arch }}-${{ steps.release.outputs.asset_id }}

    - name: Download MiniZinc Edge
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/minizinc"
        download_dir="$install_dir/downloads"
        mkdir -p "$download_dir"

        if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
          gh release download edge \
            --repo MiniZinc/libminizinc \
            --pattern '${{ steps.release.outputs.asset_name }}' \
            --dir "$download_dir"
        fi
        if [[ "$RUNNER_OS" == Windows ]]; then
          tar -xf "$download_dir/${{ steps.release.outputs.asset_name }}" -C "$install_dir"
        else
          tar -xzf "$download_dir/${{ steps.release.outputs.asset_name }}" -C "$install_dir"
        fi

        bin_dir="$(find "$install_dir" -type d -name bin -print -quit)"
        test -n "$bin_dir"
        echo "$bin_dir" >> "$GITHUB_PATH"
        export PATH="$bin_dir:$PATH"

        config_dirs="$(minizinc --config-dirs)"
        stdlib_dir="$(jq -r '.mznStdlibDir // empty' <<<"$config_dirs")"
        test -n "$stdlib_dir"
        echo "MZN_STDLIB_DIR=$stdlib_dir" >> "$GITHUB_ENV"
        minizinc --version
