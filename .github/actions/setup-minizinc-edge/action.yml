name: Set up MiniZinc Edge
description: Download MiniZinc Edge and expose its executable and standard library

runs:
  using: composite
  steps:
    - name: Identify MiniZinc Edge release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: echo "id=$(gh api repos/MiniZinc/MiniZincIDE/releases/tags/edge --jq .id)" >> "$GITHUB_OUTPUT"

    - name: Cache MiniZinc Edge archive
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/minizinc/downloads
        key: minizinc-edge-${{ runner.os }}-${{ steps.release.outputs.id }}

    - name: Download MiniZinc Edge
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        install_dir="$RUNNER_TEMP/minizinc"
        download_dir="$install_dir/downloads"
        mkdir -p "$download_dir"

        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install --yes libegl1
            if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
              gh release download edge \
                --repo MiniZinc/MiniZincIDE \
                --pattern 'MiniZincIDE-build*-bundle-linux-x86_64.tgz' \
                --dir "$download_dir"
            fi
            tar -xzf "$download_dir"/MiniZincIDE-build*-bundle-linux-x86_64.tgz -C "$install_dir"
            bundle_dir="$(find "$install_dir" -maxdepth 1 -type d -name 'MiniZincIDE-*-bundle-linux-x86_64' -print -quit)"
            ;;
          macOS)
            if [[ "${{ steps.cache.outputs.cache-hit }}" != "true" ]]; then
              gh release download edge \
                --repo MiniZinc/MiniZincIDE \
                --pattern 'MiniZincIDE-build*-bundled.dmg' \
                --dir "$download_dir"
            fi
            mount_dir="$install_dir/mount"
            mkdir "$mount_dir"
            hdiutil attach "$download_dir"/MiniZincIDE-build*-bundled.dmg -nobrowse -mountpoint "$mount_dir"
            bundle_dir="$mount_dir/MiniZincIDE.app/Contents/Resources"
            ;;
          *)
            echo "MiniZinc Edge setup is not implemented for $RUNNER_OS" >&2
            exit 1
            ;;
        esac

        minizinc="$(find "$bundle_dir" -type f -name minizinc -perm -u+x -print -quit)"
        stdlib="$(find "$bundle_dir" -path '*/share/minizinc/std/stdlib.mzn' -print -quit)"
        test -n "$minizinc"
        test -n "$stdlib"

        echo "$(dirname "$minizinc")" >> "$GITHUB_PATH"
        echo "MZN_STDLIB_DIR=$(dirname "$(dirname "$stdlib")")" >> "$GITHUB_ENV"
        "$minizinc" --version
